name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test core library
        run: dotnet test tests/Antenna.Core.Tests

      - name: Build the way the README says (Debug, Platform only)
        run: dotnet build src/Antenna.App -p:Platform=x64

      - name: Publish Windows app
        run: dotnet publish src/Antenna.App -c Release -p:Platform=x64 -r win-x64 --self-contained -o publish

      - name: Check the published app has its XAML resources
        shell: pwsh
        run: |
          $pri = Get-ChildItem publish -Filter *.pri | Where-Object { $_.Name -in "resources.pri", "Antenna.App.pri" }
          if (-not $pri) { Get-ChildItem publish -Filter *.pri | Format-Table Name, Length; throw "The app's .pri is missing from publish: windows and pages won't load." }
          Write-Host "Found $($pri.Name) ($($pri.Length) bytes)"

      - name: Start the published app and open every page
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA "AntennaData\logs\antenna.log"
          # Twice: a normal start, then a start with TV mode already on (as after a restart with it saved).
          foreach ($run in @("--smoke-test", "--smoke-test --tv")) {
            Write-Host "=== Antenna.App.exe $run"
            Remove-Item $log -ErrorAction SilentlyContinue
            $failed = $null
            $app = Start-Process publish\Antenna.App.exe -ArgumentList $run -PassThru
            $null = $app.Handle  # keeps the exit code readable after the process ends
            if (-not $app.WaitForExit(120000)) { Stop-Process $app -Force; $failed = "it was still running after 2 minutes" }
            if (Test-Path $log) { Get-Content $log } else { Write-Host "No log was written." }
            if (-not $failed -and $app.ExitCode -ne 0) { $failed = "it exited with code $($app.ExitCode)" }
            if (-not $failed -and -not (Select-String -Path $log -Pattern "Smoke test passed" -Quiet)) { $failed = "it never reported 'Smoke test passed'" }
            if (-not $failed -and (Select-String -Path $log -Pattern " ERROR " -Quiet)) { $failed = "errors were logged" }
            if ($failed) { throw "Smoke test ($run) failed: $failed." }
          }

      - uses: actions/upload-artifact@v6
        with:
          name: Antenna-win-x64
          path: publish

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: Test and build the Android app
        # Signed with a throwaway debug key: fine for trying a build, but it won't install over a release.
        run: ./gradlew testReleaseUnitTest assembleRelease --no-daemon

      - uses: actions/upload-artifact@v6
        with:
          name: Antenna-android
          path: android/app/build/outputs/apk/release/app-release.apk

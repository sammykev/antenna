name: Release

# Push a tag like v0.2.0 to build, sign, package and publish an installer plus update files to
# GitHub Releases. Installed copies of Antenna pick the new version up from there.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0"
        required: true
      unsigned:
        description: "Release without signing, even if the certificate secrets exist"
        type: boolean
        default: false

permissions:
  contents: write

env:
  VPK_VERSION: 1.2.161

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history, for the release notes

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $v = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}" }
          $v = $v.TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$v' must look like 1.2.3" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Test core library
        run: dotnet test tests/Antenna.Core.Tests

      - name: Publish Windows app
        run: dotnet publish src/Antenna.App -c Release -p:Platform=x64 -r win-x64 --self-contained -p:Version=${{ steps.version.outputs.value }} -o publish

      - name: Check the published app has its XAML resources
        shell: pwsh
        run: |
          $pri = Get-ChildItem publish -Filter *.pri | Where-Object { $_.Name -in "resources.pri", "Antenna.App.pri" }
          if (-not $pri) { Get-ChildItem publish -Filter *.pri | Format-Table Name, Length; throw "The app's .pri is missing from publish: windows and pages won't load." }
          Write-Host "Found $($pri.Name) ($($pri.Length) bytes)"

      - name: Start the published app and open every page
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA "AntennaData\logs\antenna.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $app = Start-Process publish\Antenna.App.exe -ArgumentList "--smoke-test" -PassThru
          $null = $app.Handle  # keeps the exit code readable after the process ends
          if (-not $app.WaitForExit(120000)) { Stop-Process $app -Force; $failed = "it was still running after 2 minutes" }
          if (Test-Path $log) { Get-Content $log } else { Write-Host "No log was written." }
          if (-not $failed -and $app.ExitCode -ne 0) { $failed = "it exited with code $($app.ExitCode)" }
          if (-not $failed -and -not (Select-String -Path $log -Pattern "Smoke test passed" -Quiet)) { $failed = "it never reported 'Smoke test passed'" }
          if (-not $failed -and (Select-String -Path $log -Pattern " ERROR " -Quiet)) { $failed = "errors were logged" }
          if ($failed) { throw "Smoke test failed: $failed." }

      - name: Write release notes
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          $previous = git describe --tags --abbrev=0 2>$null
          $range = if ($previous) { "$previous..HEAD" } else { "HEAD" }
          # Commit subjects, minus housekeeping that means nothing to someone using the app.
          $lines = git log $range --no-merges --format="- %s" | Where-Object { $_ -notmatch '^- (Release|Roadmap|Build|CI)\b' }
          if (-not $lines) { $lines = @("- Fixes and improvements") }
          (@("## What's new in Antenna $v", "") + $lines) -join "`n" | Set-Content -Encoding utf8 release-notes.md
          Get-Content release-notes.md

      - name: Install Velopack
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      # Lets vpk build a small delta update from the previous release.
      - name: Download previous release
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}

      # Signs when the SIGNING_CERT_PFX (base64 .pfx) and SIGNING_CERT_PASSWORD secrets exist;
      # otherwise the release is unsigned. See scripts/New-SigningCert.ps1.
      - name: Prepare signing certificate
        id: sign
        shell: pwsh
        env:
          PFX: ${{ secrets.SIGNING_CERT_PFX }}
          PFX_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if ("${{ inputs.unsigned }}" -eq "true") { Write-Host "Unsigned release requested."; "params=" >> $env:GITHUB_OUTPUT; exit 0 }
          if (-not $env:PFX) { Write-Host "No signing certificate secret: building unsigned."; "params=" >> $env:GITHUB_OUTPUT; exit 0 }
          $text = $env:PFX.Trim()
          if ($text -match '^[0-9A-Fa-f]{40}$') { throw "SIGNING_CERT_PFX holds the certificate's thumbprint, not the certificate. Paste the contents of antenna-signing.pfx.txt (thousands of characters, starting with MII)." }
          if ($text.Length -lt 1000) { throw "SIGNING_CERT_PFX is only $($text.Length) characters; the certificate is thousands. Paste the whole contents of antenna-signing.pfx.txt." }
          if ($text.StartsWith("-----BEGIN")) { throw "SIGNING_CERT_PFX holds a PEM certificate. Paste the contents of antenna-signing.pfx.txt instead." }
          try { $bytes = [Convert]::FromBase64String($text) }
          catch { throw "SIGNING_CERT_PFX isn't valid base64 ($($text.Length) characters). Paste the whole contents of antenna-signing.pfx.txt." }
          Write-Host "SIGNING_CERT_PFX decodes to $($bytes.Length) bytes."
          $publicOnly = $false
          try { $probe = [Security.Cryptography.X509Certificates.X509Certificate2]::new([byte[]]$bytes); $publicOnly = -not $probe.HasPrivateKey } catch { }
          $path = Join-Path $env:RUNNER_TEMP "antenna-signing.pfx"
          [IO.File]::WriteAllBytes($path, $bytes)
          # Import into the runner's store and sign by thumbprint, so the password never goes on a command line.
          try {
            $secure = ConvertTo-SecureString ($env:PFX_PASSWORD ?? "") -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          }
          catch {
            if ($publicOnly) { throw "SIGNING_CERT_PFX is the public certificate (.cer), which can't sign. Paste the contents of antenna-signing.pfx.txt instead." }
            throw "Couldn't open the signing certificate: SIGNING_CERT_PASSWORD doesn't match antenna-signing.pfx, or SIGNING_CERT_PFX is incomplete. ($($_.Exception.Message))"
          }
          finally { Remove-Item $path -ErrorAction SilentlyContinue }
          if (-not $cert.HasPrivateKey) { throw "The signing certificate has no private key. Use antenna-signing.pfx.txt, not the .cer file." }
          Write-Host "Signing with $($cert.Subject), thumbprint $($cert.Thumbprint), valid until $($cert.NotAfter)."
          "params=/fd sha256 /sha1 $($cert.Thumbprint) /tr http://timestamp.digicert.com /td sha256" >> $env:GITHUB_OUTPUT

      - name: Package installer and update
        shell: pwsh
        env:
          SIGN_PARAMS: ${{ steps.sign.outputs.params }}
        run: |
          $vpkArgs = @(
            "pack",
            "--packId", "Antenna",
            "--packVersion", "${{ steps.version.outputs.value }}",
            "--packDir", "publish",
            "--mainExe", "Antenna.App.exe",
            "--packTitle", "Antenna",
            "--packAuthors", "Okechukwu Nkwocha",
            "--icon", "src/Antenna.App/Assets/Antenna.ico",
            "--runtime", "win-x64",
            "--releaseNotes", "release-notes.md"
          )
          if ($env:SIGN_PARAMS) { $vpkArgs += @("--signParams", $env:SIGN_PARAMS) }
          vpk @vpkArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub release
        run: vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --publish --releaseName "Antenna ${{ steps.version.outputs.value }}" --tag v${{ steps.version.outputs.value }}

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          Remove-Item (Join-Path $env:RUNNER_TEMP "antenna-signing.pfx") -ErrorAction SilentlyContinue
          Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | ForEach-Object { Remove-Item $_.PSPath -ErrorAction SilentlyContinue }
